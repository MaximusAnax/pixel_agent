<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OSWorld failure viewer</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --txt: #e6e8ec; --muted: #9aa3b2; --accent: #4f9cff;
    --perc: #2bb6a3; --cog: #e8923a; --other: #8a93a5;
    --good: #3fb950; --bad: #f0556b; --warn: #d6a93a;
    --human: #4f9cff; --j7: #e8923a; --j32: #b07ad6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--txt); font: 13px/1.5 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  a { color: var(--accent); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* layout */
  #top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px;
         padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  #top h1 { font-size: 14px; margin: 0; font-weight: 600; }
  #top .meta { color: var(--muted); font-size: 12px; }
  #top .spacer { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 11px;
          background: var(--panel2); border: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .chip b { color: var(--txt); }
  button { background: var(--panel2); color: var(--txt); border: 1px solid var(--border);
           border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--accent); }

  #main { display: flex; height: calc(100vh - 41px); }
  #side { width: 340px; min-width: 340px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--panel); }
  #filters { padding: 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px; }
  #filters input[type=text], #filters select { width: 100%; background: var(--panel2); color: var(--txt);
          border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; font-size: 12px; }
  .qfilters { display: flex; flex-wrap: wrap; gap: 5px; }
  .qf { font-size: 11px; padding: 3px 7px; border-radius: 11px; }
  .qf.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #list { overflow-y: auto; flex: 1; }
  .item { padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .item:hover { background: var(--panel2); }
  .item.sel { background: #20364f; }
  .item .dom { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .item .ins { font-size: 12px; margin: 2px 0 4px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .item .badges { display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.good { background: var(--good); } .dot.bad { background: var(--bad); }
  .dot.warn { background: var(--warn); } .dot.none { background: #3a4150; }
  .miniLabel { font-size: 10px; padding: 1px 6px; border-radius: 9px; border: 1px solid var(--border); color: var(--muted); }

  #content { flex: 1; overflow-y: auto; padding: 16px 20px 80px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 13px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .instr { font-size: 15px; line-height: 1.45; }
  .submeta { color: var(--muted); font-size: 12px; margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
  .pill { padding: 1px 8px; border-radius: 10px; border: 1px solid var(--border); }
  .pill.fail { color: var(--bad); border-color: var(--bad); }

  /* label form */
  .formrow { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  select, input[type=number], textarea { background: var(--panel2); color: var(--txt); border: 1px solid var(--border);
          border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit; }
  textarea { width: 100%; min-height: 52px; resize: vertical; }
  .defn { font-size: 11px; color: var(--muted); margin-top: 3px; max-width: 520px; }
  .seclist { display: flex; flex-wrap: wrap; gap: 8px 14px; max-width: 760px; }
  .seclist label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--txt); text-transform: none; letter-spacing: 0; }
  .saved { font-size: 11px; color: var(--good); }
  .cat-perception_grounding { color: var(--perc); } .cat-cognitive_planning { color: var(--cog); } .cat-other { color: var(--other); }

  /* judges */
  .judges { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .judge { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 11px; }
  .judge h3 { margin: 0 0 8px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .judge .tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; color: #fff; }
  .tag.j7 { background: var(--j7); } .tag.j32 { background: var(--j32); }
  .kv { display: flex; gap: 8px; font-size: 12px; margin: 3px 0; }
  .kv .k { color: var(--muted); min-width: 92px; }
  .agree { display: inline-block; margin: 6px 0; padding: 3px 9px; border-radius: 11px; font-size: 11px; font-weight: 600; }
  .agree.match { background: rgba(63,185,80,.15); color: var(--good); border: 1px solid var(--good); }
  .agree.catmatch { background: rgba(214,169,58,.15); color: var(--warn); border: 1px solid var(--warn); }
  .agree.mismatch { background: rgba(240,85,107,.15); color: var(--bad); border: 1px solid var(--bad); }
  .agree.nolabel { background: var(--panel); color: var(--muted); border: 1px solid var(--border); }
  .analysis { font-size: 12px; color: #cfd4dd; white-space: pre-wrap; margin-top: 8px;
              border-left: 2px solid var(--border); padding-left: 9px; }
  details > summary { cursor: pointer; color: var(--accent); font-size: 12px; }

  /* steps */
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 4px; }
  .step { display: flex; gap: 14px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; background: var(--panel); }
  .step.human { border-color: var(--human); box-shadow: inset 3px 0 0 var(--human); }
  .step.j7 { box-shadow: inset 3px 0 0 var(--j7); }
  .step.j32 { box-shadow: inset 3px 0 0 var(--j32); }
  .step .shot { width: 360px; min-width: 360px; }
  .step .shot img { width: 100%; border: 1px solid var(--border); border-radius: 5px; cursor: zoom-in; display: block; }
  .step .shot .noimg { color: var(--muted); font-size: 12px; padding: 30px; text-align: center; border: 1px dashed var(--border); border-radius: 5px; }
  .step .body { flex: 1; min-width: 0; }
  .step .sidx { font-weight: 600; margin-bottom: 5px; display: flex; gap: 8px; align-items: center; }
  .flag { font-size: 10px; padding: 1px 6px; border-radius: 8px; color: #fff; }
  .flag.h { background: var(--human); } .flag.j7 { background: var(--j7); } .flag.j32 { background: var(--j32); }
  .action { font-family: ui-monospace, monospace; font-size: 12px; background: #0c0e12; border: 1px solid var(--border);
            border-radius: 5px; padding: 6px 8px; white-space: pre-wrap; word-break: break-word; margin-bottom: 6px; }
  .reasoning { font-size: 12px; color: #c3c9d4; white-space: pre-wrap; word-break: break-word; }

  /* lightbox */
  #lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 100; align-items: center; justify-content: center; }
  #lb img { max-width: 96vw; max-height: 92vh; }
  #lb .nav { position: fixed; top: 50%; transform: translateY(-50%); font-size: 40px; color: #fff; cursor: pointer; user-select: none; padding: 0 18px; opacity: .7; }
  #lb .nav:hover { opacity: 1; }
  #lb #lbprev { left: 0; } #lb #lbnext { right: 0; }
  #lb #lbcap { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; }
  #lb #lbclose { position: fixed; top: 14px; right: 20px; font-size: 26px; color: #fff; cursor: pointer; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>
<div id="top">
  <h1>OSWorld failure viewer</h1>
  <span class="meta" id="metaInfo"></span>
  <div class="spacer"></div>
  <span class="chip">labeled <b id="cLabeled">0</b>/<span id="cTotal">0</span></span>
  <span class="chip" title="7B judge primary-mode agreement with your labels">7B vs you <b id="c7">–</b></span>
  <span class="chip" title="32B judge primary-mode agreement with your labels">32B vs you <b id="c32">–</b></span>
  <span class="chip" title="7B vs 32B judge primary-mode agreement">7B vs 32B <b id="c732">–</b></span>
  <button id="btnExport">Export labels</button>
  <button id="btnImport">Import</button>
  <input type="file" id="fileImport" accept="application/json" style="display:none" />
</div>

<div id="main">
  <div id="side">
    <div id="filters">
      <input type="text" id="search" placeholder="search instruction / task id…" />
      <select id="domainSel"><option value="">all domains</option></select>
      <div class="qfilters" id="qfilters">
        <button class="qf" data-f="unlabeled">unlabeled</button>
        <button class="qf" data-f="labeled">labeled</button>
        <button class="qf" data-f="d7">7B≠you</button>
        <button class="qf" data-f="d32">32B≠you</button>
        <button class="qf" data-f="d732">7B≠32B</button>
      </div>
    </div>
    <div id="list"></div>
  </div>
  <div id="content"><div class="empty">Select a trajectory from the left.</div></div>
</div>

<div id="lb">
  <span id="lbclose">✕</span>
  <span class="nav" id="lbprev">‹</span>
  <img id="lbimg" src="" />
  <span class="nav" id="lbnext">›</span>
  <div id="lbcap"></div>
</div>

<script src="data.js"></script>
<script>
(function () {
  "use strict";
  const DATA = window.TRAJ_DATA || [];
  const TAX = window.TAXONOMY || { categories: [], modes: [] };
  const META = window.META || {};
  const STORE_KEY = "osworld_labels::" + (META.title || "viewer");

  // taxonomy helpers
  const MODE_CAT = {};      // mode -> category
  const MODE_DEFN = {};     // mode -> definition
  const MODES_BY_CAT = {};  // category -> [modes]
  TAX.modes.forEach(m => {
    MODE_CAT[m.mode] = m.category;
    MODE_DEFN[m.mode] = m.definition;
    (MODES_BY_CAT[m.category] = MODES_BY_CAT[m.category] || []).push(m.mode);
  });

  // labels store
  let labels = {};
  try { labels = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { labels = {}; }
  function saveStore() { localStorage.setItem(STORE_KEY, JSON.stringify(labels)); }

  const byUid = {}; DATA.forEach(t => byUid[t.uid] = t);
  let selUid = null;
  let activeFilters = new Set();
  let lbList = [], lbIdx = 0;

  const $ = s => document.querySelector(s);
  const el = (tag, props, kids) => {
    const e = document.createElement(tag);
    if (props) for (const k in props) {
      if (k === "class") e.className = props[k];
      else if (k === "html") e.innerHTML = props[k];
      else if (k === "text") e.textContent = props[k];
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    }
    (kids || []).forEach(c => e.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return e;
  };

  // agreement between judge classification and human label: 'match' | 'catmatch' | 'mismatch' | null(no data)
  function agreement(human, judge) {
    if (!judge || !judge.primary_failure_mode) return null;
    if (!human || !human.primary) return "nolabel";
    if (human.primary === judge.primary_failure_mode) return "match";
    const hc = MODE_CAT[human.primary], jc = MODE_CAT[judge.primary_failure_mode];
    return hc === jc ? "catmatch" : "mismatch";
  }

  // ---------- sidebar ----------
  function domainList() {
    const s = new Set(DATA.map(t => t.domain));
    return Array.from(s).sort();
  }
  function passesFilters(t) {
    const q = $("#search").value.trim().toLowerCase();
    if (q && !(t.instruction.toLowerCase().includes(q) || t.task_id.toLowerCase().includes(q))) return false;
    const dom = $("#domainSel").value;
    if (dom && t.domain !== dom) return false;
    const h = labels[t.uid];
    for (const f of activeFilters) {
      if (f === "unlabeled" && h && h.primary) return false;
      if (f === "labeled" && !(h && h.primary)) return false;
      if (f === "d7" && agreement(h, t.judges["7b"]) !== "mismatch" && agreement(h, t.judges["7b"]) !== "catmatch") return false;
      if (f === "d32" && agreement(h, t.judges["32b"]) !== "mismatch" && agreement(h, t.judges["32b"]) !== "catmatch") return false;
      if (f === "d732") {
        const a = t.judges["7b"], b = t.judges["32b"];
        if (!a || !b || a.primary_failure_mode === b.primary_failure_mode) return false;
      }
    }
    return true;
  }
  function judgeDot(human, judge) {
    const a = agreement(human, judge);
    const cls = a === "match" ? "good" : a === "catmatch" ? "warn" : a === "mismatch" ? "bad" : "none";
    return el("span", { class: "dot " + cls });
  }
  function renderList() {
    const list = $("#list"); list.innerHTML = "";
    const shown = DATA.filter(passesFilters);
    shown.forEach(t => {
      const h = labels[t.uid];
      const item = el("div", { class: "item" + (t.uid === selUid ? " sel" : ""), onclick: () => select(t.uid) }, [
        el("div", { class: "dom" }, [el("span", { text: t.domain }), el("span", { text: t.num_steps + " steps" })]),
        el("div", { class: "ins", text: t.instruction }),
      ]);
      const badges = el("div", { class: "badges" });
      if (h && h.primary) {
        badges.appendChild(el("span", { class: "miniLabel cat-" + MODE_CAT[h.primary], text: h.primary }));
      } else {
        badges.appendChild(el("span", { class: "miniLabel", text: "unlabeled" }));
      }
      badges.appendChild(el("span", { class: "spacer", style: "flex:1" }));
      if (t.judges["7b"]) { badges.appendChild(el("span", { class: "miniLabel", text: "7B" })); badges.appendChild(judgeDot(h, t.judges["7b"])); }
      if (t.judges["32b"]) { badges.appendChild(el("span", { class: "miniLabel", text: "32B" })); badges.appendChild(judgeDot(h, t.judges["32b"])); }
      item.appendChild(badges);
      list.appendChild(item);
    });
    if (!shown.length) list.appendChild(el("div", { class: "empty", text: "no trajectories match filters" }));
  }

  // ---------- main panel ----------
  function select(uid) {
    selUid = uid;
    renderList();
    renderContent();
    $("#content").scrollTop = 0;
  }

  function judgeCard(name, tagcls, judge, human) {
    if (!judge) {
      return el("div", { class: "judge" }, [
        el("h3", {}, [name, el("span", { class: "tag " + tagcls, text: name })]),
        el("div", { class: "kv", html: '<span class="k">status</span> <span style="color:var(--muted)">not yet judged</span>' }),
      ]);
    }
    const a = agreement(human, judge);
    const agreeTxt = a === "match" ? "✓ matches your primary mode"
      : a === "catmatch" ? "~ same category, different mode"
      : a === "mismatch" ? "✗ disagrees with your label"
      : "label this trajectory to compare";
    const c = el("div", { class: "judge" }, [
      el("h3", {}, [el("span", { class: "tag " + tagcls, text: name + " judge" })]),
      el("div", { class: "agree " + (a || "nolabel"), text: agreeTxt }),
      el("div", { class: "kv", html: `<span class="k">category</span> <span class="cat-${judge.category}">${judge.category || "?"}</span>` }),
      el("div", { class: "kv", html: `<span class="k">primary mode</span> <b>${judge.primary_failure_mode || "?"}</b>` }),
      el("div", { class: "kv", html: `<span class="k">failing step</span> ${judge.failing_step != null ? judge.failing_step : "?"}` }),
      el("div", { class: "kv", html: `<span class="k">confidence</span> ${judge.confidence != null ? judge.confidence : "?"}` }),
    ]);
    if (judge.secondary_failure_modes && judge.secondary_failure_modes.length)
      c.appendChild(el("div", { class: "kv", html: `<span class="k">secondary</span> ${judge.secondary_failure_modes.join(", ")}` }));
    if (judge.analysis) {
      const d = el("details", {}, [el("summary", { text: "show reasoning" }), el("div", { class: "analysis", text: judge.analysis })]);
      c.appendChild(d);
    }
    return c;
  }

  function labelForm(t) {
    const h = labels[t.uid] || { category: "", primary: "", secondary: [], failing_step: "", notes: "", confidence: "" };
    const card = el("div", { class: "card" }, [el("h2", { text: "Your label" })]);

    const savedTag = el("span", { class: "saved", text: "" });
    function commit() {
      h.secondary = h.secondary || [];
      labels[t.uid] = h; saveStore();
      savedTag.textContent = "saved ✓"; setTimeout(() => savedTag.textContent = "", 1200);
      updateCounters(); renderList();
      // refresh judge agreement badges live
      $("#judgesMount").replaceWith(renderJudges(t));
      refreshStepFlags(t);
    }

    // category
    const catSel = el("select", { onchange: () => {
      h.category = catSel.value;
      // reset primary if it no longer fits the chosen category
      if (h.primary && MODE_CAT[h.primary] !== h.category) h.primary = "";
      buildPrimary(); commit();
    }}, [el("option", { value: "", text: "— choose category —" })]);
    TAX.categories.forEach(c => {
      const o = el("option", { value: c, text: c }); if (h.category === c) o.selected = true; catSel.appendChild(o);
    });

    const primaryWrap = el("div", { class: "field" });
    const defnBox = el("div", { class: "defn" });
    let primSel;
    function buildPrimary() {
      primaryWrap.innerHTML = "";
      primaryWrap.appendChild(el("label", { text: "Primary failure mode" }));
      primSel = el("select", { onchange: () => { h.primary = primSel.value; showDefn(); commit(); } },
        [el("option", { value: "", text: "— choose primary mode —" })]);
      const cats = h.category ? [h.category] : TAX.categories;
      cats.forEach(cat => {
        const grp = el("optgroup", { label: cat });
        (MODES_BY_CAT[cat] || []).forEach(m => {
          const o = el("option", { value: m, text: m }); if (h.primary === m) o.selected = true; grp.appendChild(o);
        });
        primSel.appendChild(grp);
      });
      primaryWrap.appendChild(primSel);
      primaryWrap.appendChild(defnBox);
      showDefn();
    }
    function showDefn() { defnBox.textContent = h.primary ? MODE_DEFN[h.primary] : ""; }
    buildPrimary();

    // secondary modes
    const secWrap = el("div", { class: "field" }, [el("label", { text: "Secondary modes (optional)" })]);
    const secList = el("div", { class: "seclist" });
    TAX.modes.forEach(m => {
      const cb = el("input", { type: "checkbox" });
      cb.checked = (h.secondary || []).includes(m.mode);
      cb.addEventListener("change", () => {
        h.secondary = h.secondary || [];
        if (cb.checked) { if (!h.secondary.includes(m.mode)) h.secondary.push(m.mode); }
        else h.secondary = h.secondary.filter(x => x !== m.mode);
        commit();
      });
      secList.appendChild(el("label", { title: m.definition }, [cb, m.mode]));
    });
    const secDetails = el("details", {}, [el("summary", { text: "secondary modes" }), secList]);
    secWrap.appendChild(secDetails);

    // failing step + confidence + notes
    const stepInp = el("input", { type: "number", min: "-1", value: h.failing_step, style: "width:110px",
      oninput: () => { h.failing_step = stepInp.value; commit(); } });
    const confInp = el("input", { type: "number", min: "0", max: "1", step: "0.1", value: h.confidence, style: "width:110px",
      oninput: () => { h.confidence = confInp.value; commit(); } });
    const notes = el("textarea", { placeholder: "free-text notes / evidence…", oninput: () => { h.notes = notes.value; commit(); } });
    notes.value = h.notes || "";

    const row1 = el("div", { class: "formrow" }, [
      el("div", { class: "field" }, [el("label", { text: "Category" }), catSel]),
      primaryWrap,
    ]);
    const row2 = el("div", { class: "formrow" }, [
      el("div", { class: "field" }, [el("label", { text: "Failing step (idx, -1=NA)" }), stepInp]),
      el("div", { class: "field" }, [el("label", { text: "Your confidence (0–1)" }), confInp]),
      el("div", { class: "field", style: "flex:1; min-width:260px" }, [el("label", { text: "Notes" }), notes]),
    ]);
    card.appendChild(row1);
    card.appendChild(secWrap);
    card.appendChild(row2);
    card.appendChild(savedTag);
    return card;
  }

  function renderJudges(t) {
    const h = labels[t.uid];
    const wrap = el("div", { class: "card", id: "judgesMount" }, [
      el("h2", { text: "Judges (VLM-as-judge) vs your label" }),
      el("div", { class: "judges" }, [
        judgeCard("7B", "j7", t.judges["7b"], h),
        judgeCard("32B", "j32", t.judges["32b"], h),
      ]),
    ]);
    return wrap;
  }

  function stepClasses(t, idx) {
    const h = labels[t.uid];
    const cls = [];
    if (h && String(h.failing_step) === String(idx)) cls.push("human");
    if (t.judges["7b"] && String(t.judges["7b"].failing_step) === String(idx)) cls.push("j7");
    if (t.judges["32b"] && String(t.judges["32b"].failing_step) === String(idx)) cls.push("j32");
    return cls;
  }
  function refreshStepFlags(t) {
    document.querySelectorAll(".step").forEach(node => {
      const idx = node.getAttribute("data-idx");
      node.className = "step " + stepClasses(t, idx).join(" ");
    });
  }

  function renderContent() {
    const t = byUid[selUid];
    const c = $("#content"); c.innerHTML = "";
    if (!t) { c.appendChild(el("div", { class: "empty", text: "Select a trajectory." })); return; }

    // header
    const header = el("div", { class: "card" }, [
      el("h2", { text: t.domain + "  ·  " + t.model }),
      el("div", { class: "instr", text: t.instruction }),
      el("div", { class: "submeta" }, [
        el("span", { class: "pill fail", text: "reward " + t.reward + " (FAIL)" }),
        el("span", { class: "pill", text: t.num_steps + " steps" }),
        el("span", { class: "mono", text: t.task_id }),
      ]),
    ]);
    c.appendChild(header);
    c.appendChild(labelForm(t));
    c.appendChild(renderJudges(t));

    // steps
    const stepsCard = el("div", { class: "card" }, [
      el("h2", { text: "Trajectory steps" }),
      el("div", { class: "legend" }, [
        el("span", { html: '<i style="border-color:var(--human)"></i>your failing step' }),
        el("span", { html: '<i style="border-color:var(--j7)"></i>7B failing step' }),
        el("span", { html: '<i style="border-color:var(--j32)"></i>32B failing step' }),
        el("span", { text: "click a screenshot to zoom" }),
      ]),
    ]);
    const imgs = t.steps.filter(s => s.img);
    t.steps.forEach(s => {
      const shot = s.img
        ? el("div", { class: "shot" }, [el("img", { src: s.img, loading: "lazy", onclick: () => openLb(imgs, imgs.findIndex(x => x.idx === s.idx), t) })])
        : el("div", { class: "shot" }, [el("div", { class: "noimg", text: "no screenshot" })]);
      const flags = el("span", {});
      const sc = stepClasses(t, s.idx);
      if (sc.includes("human")) flags.appendChild(el("span", { class: "flag h", text: "you" }));
      if (sc.includes("j7")) flags.appendChild(el("span", { class: "flag j7", text: "7B" }));
      if (sc.includes("j32")) flags.appendChild(el("span", { class: "flag j32", text: "32B" }));
      const body = el("div", { class: "body" }, [
        el("div", { class: "sidx" }, ["Step " + s.idx, flags]),
        el("div", { class: "action", text: s.action || "(no action recorded)" }),
      ]);
      if (s.reasoning) {
        const long = s.reasoning.length > 280;
        if (long) body.appendChild(el("details", {}, [el("summary", { text: "reasoning" }), el("div", { class: "reasoning", text: s.reasoning })]));
        else body.appendChild(el("div", { class: "reasoning", text: s.reasoning }));
      }
      const step = el("div", { class: "step " + sc.join(" "), "data-idx": s.idx }, [shot, body]);
      stepsCard.appendChild(step);
    });
    c.appendChild(stepsCard);
  }

  // ---------- lightbox ----------
  function openLb(imgs, idx, t) { lbList = imgs; lbIdx = idx; showLb(); $("#lb").style.display = "flex"; }
  function showLb() {
    const s = lbList[lbIdx]; if (!s) return;
    $("#lbimg").src = s.img;
    $("#lbcap").textContent = "step " + s.idx + "  (" + (lbIdx + 1) + "/" + lbList.length + ")";
  }
  $("#lbclose").onclick = () => $("#lb").style.display = "none";
  $("#lbprev").onclick = () => { lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; showLb(); };
  $("#lbnext").onclick = () => { lbIdx = (lbIdx + 1) % lbList.length; showLb(); };
  $("#lb").addEventListener("click", e => { if (e.target.id === "lb") $("#lb").style.display = "none"; });

  // ---------- counters ----------
  function updateCounters() {
    const total = DATA.length;
    let labeled = 0, a7 = [0, 0], a32 = [0, 0], a732 = [0, 0];
    DATA.forEach(t => {
      const h = labels[t.uid];
      if (h && h.primary) {
        labeled++;
        if (t.judges["7b"]) { a7[1]++; if (t.judges["7b"].primary_failure_mode === h.primary) a7[0]++; }
        if (t.judges["32b"]) { a32[1]++; if (t.judges["32b"].primary_failure_mode === h.primary) a32[0]++; }
      }
      const a = t.judges["7b"], b = t.judges["32b"];
      if (a && b) { a732[1]++; if (a.primary_failure_mode === b.primary_failure_mode) a732[0]++; }
    });
    $("#cLabeled").textContent = labeled;
    $("#cTotal").textContent = total;
    const pct = (x) => x[1] ? Math.round(100 * x[0] / x[1]) + "% (" + x[0] + "/" + x[1] + ")" : "–";
    $("#c7").textContent = pct(a7);
    $("#c32").textContent = pct(a32);
    $("#c732").textContent = pct(a732);
  }

  // ---------- export / import ----------
  $("#btnExport").onclick = () => {
    const payload = { meta: META, exported_at: new Date().toISOString(), labels };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = el("a", { href: URL.createObjectURL(blob), download: "osworld_human_labels.json" });
    document.body.appendChild(a); a.click(); a.remove();
  };
  $("#btnImport").onclick = () => $("#fileImport").click();
  $("#fileImport").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const obj = JSON.parse(r.result);
        const incoming = obj.labels || obj;
        let n = 0;
        for (const uid in incoming) { labels[uid] = incoming[uid]; n++; }
        saveStore(); updateCounters(); renderList(); if (selUid) renderContent();
        alert("Imported " + n + " labels.");
      } catch (err) { alert("Import failed: " + err.message); }
    };
    r.readAsText(f);
  });

  // ---------- keyboard nav ----------
  document.addEventListener("keydown", e => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    if ($("#lb").style.display === "flex") {
      if (e.key === "ArrowLeft") $("#lbprev").click();
      if (e.key === "ArrowRight") $("#lbnext").click();
      if (e.key === "Escape") $("#lbclose").click();
      return;
    }
    const shown = DATA.filter(passesFilters);
    const i = shown.findIndex(t => t.uid === selUid);
    if (e.key === "ArrowDown" || e.key === "j") { if (i < shown.length - 1) select(shown[i + 1].uid); e.preventDefault(); }
    if (e.key === "ArrowUp" || e.key === "k") { if (i > 0) select(shown[i - 1].uid); e.preventDefault(); }
  });

  // ---------- init ----------
  function init() {
    $("#metaInfo").textContent = `${META.n || DATA.length} failed trajectories · built ${META.built_at || ""}` +
      ` · judges: 7B ${META.n_judged_7b || 0}, 32B ${META.n_judged_32b || 0}`;
    const dsel = $("#domainSel");
    domainList().forEach(d => dsel.appendChild(el("option", { value: d, text: d })));
    $("#search").addEventListener("input", renderList);
    dsel.addEventListener("change", renderList);
    document.querySelectorAll(".qf").forEach(b => b.addEventListener("click", () => {
      const f = b.getAttribute("data-f");
      if (activeFilters.has(f)) { activeFilters.delete(f); b.classList.remove("active"); }
      else { activeFilters.add(f); b.classList.add("active"); }
      renderList();
    }));
    updateCounters();
    renderList();
    if (DATA.length) select(DATA[0].uid);
  }
  init();
})();
</script>
</body>
</html>
