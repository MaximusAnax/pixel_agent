[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cua-failure-analysis"
version = "0.1.0"
description = "Failure-mode analysis pipeline for computer-use agents on OSWorld"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "huggingface_hub>=0.24",
    "openai>=1.0",
    "anthropic>=0.40",
    "pillow>=10.0",
    "numpy>=1.24",
    "jinja2>=3.1",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# GPU-only local trajectory judge; usually provided by the cluster env, not pip.
local-judge = ["vllm>=0.11.0", "transformers>=4.49", "qwen-vl-utils>=0.0.8"]

[project.scripts]
cua-trace = "cua_failure_analysis.cli:trace_cmd"
cua-attribute = "cua_failure_analysis.cli:attribute_cmd"
cua-agreement = "cua_failure_analysis.cli:agreement_cmd"
cua-judge = "cua_failure_analysis.cli:judge_cmd"
cua-prevalence = "cua_failure_analysis.cli:prevalence_cmd"
# Whole-trajectory judge (local vLLM and/or Anthropic API)
cua-traj-parse = "cua_failure_analysis.trajectory_judge.parse_trajs:main"
cua-traj-judge = "cua_failure_analysis.trajectory_judge.run_judge:main"
cua-traj-aggregate = "cua_failure_analysis.trajectory_judge.aggregate:main"
cua-traj-compare = "cua_failure_analysis.trajectory_judge.compare_judges:main"
cua-traj-viewer = "cua_failure_analysis.trajectory_judge.build_viewer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
