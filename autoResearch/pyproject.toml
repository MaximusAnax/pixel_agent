[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-research"
version = "0.1.0"
description = "Karpathy-style autoresearch loop for pixelAgent judge/detector calibration"
readme = "README.md"
requires-python = ">=3.10"
# Also requires the errorAnalysis package: pip install -e ../errorAnalysis
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
